<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>job application website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="applyBox">
            <h1>Job Application <span class="title">(web)</span></h1>
            <form action="">
                <div class="form_container">
                    <div class="form_controls">
                        <label for="first_name">First Name</label>
                        <input type="text" name="first_name" id="first_name" placeholder="Enter first name">
                    </div>

                    <div class="form_controls">
                        <label for="last_name">Last Name</label>
                        <input type="text" name="last_name" id="last_name" placeholder="Enter last name">
                    </div>

                    <div class="form_controls">
                        <label for="email">Email</label>
                        <input type="email" name="email" placeholder="Enter your email">
                    </div>

                    <div class="form_controls">
                        <label for="job_role">job role</label>
                       <select id="job_role" name="job_role">
                        <option value="">Select job role</option>
                        <option value="Frontend">Frontend Devloper</option>
                        <option value="Backend">Backend Devloper</option>
                        <option value="Full_stack">Full Stack Devloper</option>
                        <option value="UI_UX">UI UX Designer</option>
                       </select>
                    </div>

                    <div class="textarea_controls">
                        <label for="addres">Address</label>
                        <textarea name="address" id="address" row="4" cols="50" placeholder="Enter Address"></textarea>
                    </div>

                    <div class="form_controls">
                        <label for="city">city</label>
                        <input type="text" name="city" id="city" placeholder="Enter city name">
                    </div>

                    <div class="form_controls">
                        <label for="Pincode">Pincode</label>
                        <input type="pincode" name="Pincode" id="Pincode" placeholder="Enter your pincode">
                    </div>

                    <div class="form_controls">
                        <label for="Date">Date</label>
                        <input  value="2025-02-12" type="date" id="date">
                    </div>

                    <div class="form_controls">
                        <label for="Upload">Upload your file</label>
                        <input type="file" id="upload">
                    </div>
                </div>

                <div class="button_container">
                    <button type="submit">Apply Now</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
